baseURL: https://hpccenter.sns.it/
locale: en-US
title: High Performance Computing Center

module:
  imports:
    - path: github.com/imfing/hextra

menus:
  main:
    - identifier: people
      name: People
      url: /people
      weight: 30
    - identifier: contacts
      name: Contacts
      url: /contacts
      weight: 80
    - identifier: docs
      name: Documentation
      url: /docs
      weight: 100
    - identifier: staff
      name: Staff
      url: /staff
      weight: 120

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /logo.png
      dark: /logo.png
      link: /
      width: 40
      height: 20